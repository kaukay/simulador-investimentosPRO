    <script>
        // === LÓGICA DA CALCULADORA ===
        let meuGrafico = null;

        const formatarMoeda = (valor) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        };

        document.getElementById('form-simulador').addEventListener('submit', function(e) {
            e.preventDefault();

            const valorInicial = parseFloat(document.getElementById('valor-inicial').value) || 0;
            const aporteMensal = parseFloat(document.getElementById('aporte-mensal').value) || 0;
            const taxaInformada = parseFloat(document.getElementById('taxa-juros').value) || 0;
            const tipoTaxa = document.getElementById('tipo-taxa').value;
            const prazoInformado = parseInt(document.getElementById('prazo').value) || 0;
            const tipoPrazo = document.getElementById('tipo-prazo').value;

            const totalMeses = tipoPrazo === 'anos' ? prazoInformado * 12 : prazoInformado;
            let taxaMensalSimulador = tipoTaxa === 'ano' ? Math.pow(1 + (taxaInformada / 100), 1 / 12) - 1 : taxaInformada / 100;
            const taxaMensalPoupanca = 0.005;

            let saldoSimulador = valorInicial, saldoPoupanca = valorInicial;
            let totalInvestido = valorInicial, totalJuros = 0;

            const labelsGrafico = [], dadosInvestido = [], dadosJuros = [];
            const tbody = document.getElementById('tabela-corpo');
            let linhasTabela = '';

            for (let mes = 1; mes <= totalMeses; mes++) {
                let jurosDoMes = saldoSimulador * taxaMensalSimulador;
                saldoSimulador += jurosDoMes + aporteMensal;
                totalInvestido += aporteMensal;
                totalJuros += jurosDoMes;

                saldoPoupanca += (saldoPoupanca * taxaMensalPoupanca) + aporteMensal;

                // Salvar dados para o gráfico de forma otimizada
                if (totalMeses <= 36 || mes % 12 === 0 || mes === totalMeses) {
                    labelsGrafico.push(totalMeses <= 36 ? `Mês ${mes}` : `Ano ${mes/12}`);
                    dadosInvestido.push(totalInvestido);
                    dadosJuros.push(totalJuros);
                }

                // Buffer de HTML para performance
                linhasTabela += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4 font-medium text-slate-700">${mes}</td>
                        <td class="py-3 px-4 text-slate-500">${formatarMoeda(aporteMensal)}</td>
                        <td class="py-3 px-4 text-brand-500 font-medium">+${formatarMoeda(jurosDoMes)}</td>
                        <td class="py-3 px-4 font-bold text-slate-800 text-right">${formatarMoeda(saldoSimulador)}</td>
                    </tr>
                `;
            }

            tbody.innerHTML = linhasTabela;

            // Atualiza UI
            document.getElementById('res-investido').innerText = formatarMoeda(totalInvestido);
            document.getElementById('res-juros').innerText = formatarMoeda(totalJuros);
            document.getElementById('res-total').innerText = formatarMoeda(saldoSimulador);
            document.getElementById('res-poupanca').innerText = formatarMoeda(saldoPoupanca);
            document.getElementById('res-diferenca').innerText = `+ ${formatarMoeda(saldoSimulador - saldoPoupanca)}`;

            document.getElementById('resultados').classList.remove('hidden');
            renderizarGrafico(labelsGrafico, dadosInvestido, dadosJuros);

            // Esconder teclado no celular e dar scroll suave
            document.activeElement.blur();
            setTimeout(() => document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' }), 100);
        });

        function renderizarGrafico(labels, dadosInvestido, dadosJuros) {
            const ctx = document.getElementById('grafico-evolucao').getContext('2d');
            if (meuGrafico) meuGrafico.destroy();
            
            const montanteFinal = dadosInvestido.map((val, i) => val + dadosJuros[i]);

            meuGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Investido', data: dadosInvestido, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4, borderWidth: 2, pointRadius: 0, pointHitRadius: 15 },
                        { label: 'Total', data: montanteFinal, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.2)', fill: '-1', tension: 0.4, borderWidth: 2, pointRadius: 0, pointHitRadius: 15 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false } }, // Legenda customizada já existe no UI
                    scales: {
                        y: { ticks: { callback: v => (v >= 1000) ? 'R$ ' + (v/1000).toFixed(0) + 'k' : v, font: {size: 10} }, grid: { color: '#f1f5f9' } },
                        x: { ticks: { font: {size: 10}, maxRotation: 0 }, grid: { display: false } }
                    }
                }
            });
        }
        
        // === MÁGICA DO PWA EM UM ÚNICO ARQUIVO ===

        // 1. Criar ícone SVG em formato String segura para URL
        const svgIconStr = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#2563eb" rx="112"/><path d="M120 380l100-120 60 60 120-160" stroke="#fff" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="160" r="40" fill="#10b981"/></svg>`);
        const iconDataUrl = `data:image/svg+xml;charset=utf-8,${svgIconStr}`;

        // 2. Gerar Manifest JSON dinamicamente via Blob
        const appManifest = {
            name: "Simulador de Investimentos Pro",
            short_name: "Simulador",
            description: "Calcule seus juros compostos",
            start_url: window.location.href, // Abre a página atual
            display: "standalone", // Oculta barra de navegador
            background_color: "#f1f5f9",
            theme_color: "#2563eb",
            icons: [
                { src: iconDataUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
                { src: iconDataUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
            ]
        };
        
        const manifestBlob = new Blob([JSON.stringify(appManifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestUrl;
        document.head.appendChild(linkManifest);

        // 3. Gerar Service Worker Dinâmico para Suporte Offline e Instalação
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => {
                // Intercepta requisições para evitar erro offline de tela de dinossauro.
                // Como tudo está num arquivo só, respondemos com a rede e se falhar não há muito o que fazer.
                e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(console.error);
        }

        // 4. Lógica do Botão de Instalação (Prompt nativo)
        let deferredPrompt;
        const btnInstalar = document.getElementById('btn-instalar');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Previne o Chrome 67 e anterior de mostrar o prompt automaticamente
            e.preventDefault();
            // Guarda o evento para ser disparado pelo botão
            deferredPrompt = e;
            // Mostra o botão no Header
            btnInstalar.classList.remove('hidden');
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Mostra a janela nativa de instalação do celular
                deferredPrompt.prompt();
                // Aguarda o usuário responder
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App instalado com sucesso!');
                    btnInstalar.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
        
        // Se já estiver rodando como standalone (já instalado), esconde o botão
        if (window.matchMedia('(display-mode: standalone)').matches) {
            btnInstalar.classList.add('hidden');
        }
    </script>
</body>
</html>
